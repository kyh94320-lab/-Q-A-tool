<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 마음치유, 봄처럼 - AI Q&A</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="header-top">
                <h1>🌸 2026 마음치유, 봄처럼</h1>
                <button id="settings-btn" title="API 설정" style="display: none;">⚙️ 설정</button>
            </div>
            <p class="subtitle">공모사업에 대해 궁금한 점을 AI에게 물어보세요.</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="무엇이든 물어보세요" autocomplete="off">
                <button id="search-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

            <!-- Quick Menu Grid for Staff -->
            <div class="quick-menu-section">
                <h3>📌 실무자 핵심 퀵 메뉴</h3>
                <div class="quick-menu-grid">
                    <button class="quick-btn" onclick="searchWithAI('예산 편성 기준과 항목별 한도는?')">💰 예산 편성 기준</button>
                    <button class="quick-btn" onclick="searchWithAI('신청 자격과 요건은?')">✅ 신청 자격</button>
                    <button class="quick-btn" onclick="searchWithAI('제출해야 할 필수 서류 목록은?')">📄 필수 제출 서류</button>
                    <button class="quick-btn" onclick="searchWithAI('타 사업과 중복 지원이 가능한가요?')">🚫 중복 지원 여부</button>
                    <button class="quick-btn" onclick="searchWithAI('공간 대관 규정 및 사용 가능 시간은?')">🏢 공간 대관 규정</button>

                    <button class="quick-btn" onclick="searchWithAI('지원금 정산 방법과 증빙 서류는?')">🧾 정산 및 증빙</button>
                    <button class="quick-btn" onclick="searchWithAI('심사 시 가산점 항목은?')">💯 가산점 항목</button>
                    <button class="quick-btn" onclick="searchWithAI('심사 기준과 선정 절차는?')">⚖️ 심사 및 선정</button>
                    <button class="quick-btn" onclick="searchWithAI('접수 기간과 신청 방법은?')">📅 접수 기간/방법</button>
                    <button class="quick-btn" onclick="searchWithAI('참여 인원 기준과 제한은?')">👥 참여 인원 기준</button>

                    <button class="quick-btn" onclick="searchWithAI('강사비 지급 기준과 한도는?')">🎤 강사비 지급 기준</button>
                    <button class="quick-btn" onclick="searchWithAI('홍보 의무와 결과 보고서 작성법은?')">📢 홍보 및 결과보고</button>
                    <button class="quick-btn" onclick="searchWithAI('사업 수행 시 유의사항은?')">⚠️ 피수 유의사항</button>
                    <button class="quick-btn" onclick="searchWithAI('지원 제외 대상은 누구인가요?')">❌ 지원 제외 대상</button>
                    <button class="quick-btn" onclick="searchWithAI('문의처 및 담담자는?')">📞 문의처</button>

                    <button class="quick-btn" onclick="searchWithAI('신청 서식 다운로드는 어디서?')">📥 서식 다운로드</button>
                    <button class="quick-btn" onclick="searchWithAI('현장 점검 및 모니터링 절차는?')">🕵️ 현장 점검</button>
                    <button class="quick-btn" onclick="searchWithAI('사업 변경 신청 절차는?')">🔄 사업 변경 신청</button>
                    <button class="quick-btn" onclick="searchWithAI('자부담 비율과 필수 조건은?')">💸 자부담 비율</button>
                    <button class="quick-btn" onclick="searchWithAI('성과 지표 작성 방법은?')">📈 성과 지표 작성</button>
                </div>
            </div>
        </section>

        <section id="ai-section" class="ai-section hidden">
            <div class="ai-header">
                <span class="ai-icon">✨</span>
                <h3>AI 요약 답변</h3>
            </div>
            <div id="ai-response" class="ai-content">
                <!-- AI response will appear here -->
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </section>

        <section id="results-area" class="results-grid">
            <!-- Search results will appear here -->
            <div class="empty-state">
                <p>궁금한 내용을 편하게 질문해주세요.</p>
            </div>
        </section>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>⚙️ 설정</h2>
            <div class="input-group">
                <label for="api-key">Google Gemini API Key</label>
                <input type="password" id="api-key" placeholder="AIzaSy...">
                <p class="hint">API Key는 브라우저에만 저장되며 서버로 전송되지 않습니다.</p>
            </div>
            <div class="input-group">
                <label for="model-select">모델 선택</label>
                <select id="model-select">
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash (권장/안정적)</option>
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash (최신)</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                </select>
            </div>
            <button id="save-settings" class="primary-btn">저장하기</button>
        </div>
    </div>

    <script src="data.js"></script>
    <!-- Load App Logic -->
    <script src="script.js"></script>
</body>

</html>
